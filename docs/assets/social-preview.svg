  </svg>
  <g font-family="JetBrains Mono, ui-monospace, monospace">
    <text x="480" y="270" font-size="52" font-weight="800" fill="#ffffff">fastapi-idempotency-key</text>
    <text x="480" y="335" font-size="30" fill="#a6e3a1">Exactly-once POSTs for FastAPI</text>
    <text x="480" y="400" font-size="24" fill="#bac2de">Stripe-style Idempotency-Key · atomic locks</text>
    <text x="480" y="436" font-size="24" fill="#bac2de">Memory · SQLite · Redis backends</text>
    <text x="480" y="510" font-size="24" fill="#05c4b0">pip install fastapi-idempotency-key</text>
  </g>
